<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Tennis Scores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 240px;
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    #sidebar h2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .match-item {
      display: block;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .match-item:hover { background: #252836; }

    .match-item.active {
      background: #1e2a4a;
      border-color: #3b5bdb;
    }

    .match-players {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      color: #c9d1d9;
    }

    .match-players span { display: block; }

    .match-divider {
      font-size: 10px;
      color: #4b5563;
      margin: 2px 0;
    }

    /* Main panel */
    #main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    #placeholder {
      text-align: center;
      color: #4b5563;
    }

    #placeholder p { margin-top: 8px; font-size: 14px; }

    #score-card {
      display: none;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px 48px;
      min-width: 420px;
      text-align: center;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #374151;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }

    #status-dot.connected { background: #22c55e; }

    #status-label {
      font-size: 12px;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    #set-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 24px;
    }

    #players-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .player-block { flex: 1; }

    .player-name {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .player-score {
      font-size: 56px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      transition: color 0.2s;
    }

    .player-score.flash { color: #3b5bdb; }

    .serve-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      display: inline-block;
      margin-left: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .serve-dot.visible { opacity: 1; }

    .vs-label {
      font-size: 13px;
      color: #374151;
      font-weight: 600;
    }

    #last-update {
      margin-top: 28px;
      font-size: 12px;
      color: #4b5563;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Matches</h2>
  <div id="match-list"></div>
</div>

<div id="main">
  <div id="placeholder">
    <div style="font-size: 32px;">🎾</div>
    <p>Select a match to watch live</p>
  </div>

  <div id="score-card">
    <div id="status-label">
      <span id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
    <div id="set-label">Set <span id="set-number">1</span></div>
    <div id="players-row">
      <div class="player-block" id="block-p1">
        <div class="player-name" id="name-p1">—</div>
        <div class="player-score" id="score-p1">0</div>
      </div>
      <div class="vs-label">vs</div>
      <div class="player-block" id="block-p2">
        <div class="player-name" id="name-p2">—<span class="serve-dot" id="serve-p2"></span></div>
        <div class="player-score" id="score-p2">0</div>
      </div>
    </div>
    <div id="last-update">Waiting for first update…</div>
  </div>
</div>

<script>
  let activeMatchId = null;
  let eventSource = null;

  async function loadMatches() {
    const res = await fetch("/matches");
    const matches = await res.json();
    const list = document.getElementById("match-list");

    matches.forEach((match) => {
      const item = document.createElement("a");
      item.className = "match-item";
      item.dataset.id = match.id;
      item.href = `/?match=${match.id}`;
      item.innerHTML = `
        <div class="match-players">
          <span>${match.player1}</span>
          <span class="match-divider">vs</span>
          <span>${match.player2}</span>
        </div>
      `;
      item.addEventListener("click", (e) => { e.preventDefault(); subscribe(match); });
      list.appendChild(item);
    });

    // Auto-subscribe if ?match= is in the URL (e.g. opened in a new tab)
    const params = new URLSearchParams(window.location.search);
    const preselected = params.get("match");
    if (preselected) {
      const match = matches.find((m) => m.id === preselected);
      if (match) subscribe(match);
    }
  }

  function subscribe(match) {
    if (activeMatchId === match.id) return;

    // Close previous connection
    if (eventSource) eventSource.close();

    // Update sidebar active state
    document.querySelectorAll(".match-item").forEach((el) => el.classList.remove("active"));
    document.querySelector(`[data-id="${match.id}"]`).classList.add("active");

    activeMatchId = match.id;

    // Show score card
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("score-card").style.display = "block";

    // Reset UI
    document.getElementById("name-p1").innerHTML = match.player1;
    document.getElementById("name-p2").innerHTML = `${match.player2}<span class="serve-dot" id="serve-p2"></span>`;
    document.getElementById("score-p1").textContent = "0";
    document.getElementById("score-p2").textContent = "0";
    document.getElementById("set-number").textContent = "1";
    document.getElementById("last-update").textContent = "Waiting for first update…";
    setStatus(false);

    eventSource = new EventSource(`/stream/${match.id}`);

    eventSource.onopen = () => setStatus(true);
    eventSource.onerror = () => setStatus(false);

    eventSource.addEventListener("score_update", (e) => {
      const data = JSON.parse(e.data);
      updateScore(data);
    });
  }

  function setStatus(connected) {
    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");
    dot.className = "connected" ? (connected ? "connected" : "") : "";
    if (connected) dot.classList.add("connected"); else dot.classList.remove("connected");
    text.textContent = connected ? "Connected" : "Reconnecting…";
  }

  function updateScore(data) {
    document.getElementById("score-p1").textContent = data.score1;
    document.getElementById("score-p2").textContent = data.score2;
    document.getElementById("set-number").textContent = data.set;

    // Serve indicator
    const serveDot = document.getElementById("serve-p2");
    if (serveDot) serveDot.className = `serve-dot${data.serving === data.player2 ? " visible" : ""}`;

    // Serve indicator on p1 name
    const p1Name = document.getElementById("name-p1");
    if (data.serving === data.player1) {
      p1Name.innerHTML = `${data.player1} <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#eab308;"></span>`;
    } else {
      p1Name.textContent = data.player1;
    }

    // Flash updated score
    const scoreEl = document.getElementById("score-p1");
    scoreEl.classList.add("flash");
    setTimeout(() => scoreEl.classList.remove("flash"), 400);

    document.getElementById("last-update").textContent =
      `Last update: ${new Date().toLocaleTimeString()}`;
  }

  loadMatches();
</script>
</body>
</html>
